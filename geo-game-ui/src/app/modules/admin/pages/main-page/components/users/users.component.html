<div class="table">
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="handleSort($event)" class="mat-elevation-z8">
        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
            <td mat-cell *matCellDef="let element"> {{ element.email }} </td>
        </ng-container>
    
        <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Role </th>
            <td mat-cell *matCellDef="let element"> {{ element.role }} </td>
        </ng-container>
    
        <ng-container matColumnDef="lastActivity">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Last activity </th>
            <td mat-cell *matCellDef="let element"> {{ mapDate(element.lastActivity) | date:'dd.MM.yyyy HH:mm:ss'}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let element">
                @if(element.role !== userRoleEnum.ADMIN) {
                    <fa-icon size="lg" [icon]="faTrash" appTooltip [text]="'Delete account'" (click)="deleteAccount(element.id)">
                    </fa-icon>
                }
            </td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>        
    <mat-paginator [length]="totalItems" [pageSize]="pageSize" [pageIndex]="pageIndex" (page)="handlePageEvent($event)">
    </mat-paginator>
</div>
