<div class="table">
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="handleSort($event)" class="mat-elevation-z8">
        <ng-container matColumnDef="activityDateTime">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
            <td mat-cell *matCellDef="let element"> {{ mapDate(element.activityDateTime) | date:'dd.MM.yyyy HH:mm:ss'}} </td>
        </ng-container>
    
        <ng-container matColumnDef="activityType">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Activity </th>
            <td mat-cell *matCellDef="let element"> {{ element.activityType }} </td>
        </ng-container>
    
        <ng-container matColumnDef="user">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> User </th>
            <td mat-cell *matCellDef="let element"> {{element.user.userEmail}} </td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>        
    <mat-paginator [length]="totalItems" [pageSize]="pageSize" [pageIndex]="pageIndex" (page)="handlePageEvent($event)">
    </mat-paginator>
</div>
