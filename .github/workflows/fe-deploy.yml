name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ main ]
    paths: 
      - 'geo-game-ui/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Install dependencies
        working-directory: geo-game-ui
        run: npm ci

      - name: Inject API URL
        working-directory: geo-game-ui
        run: |
          sed -i "s|\${API_URL}|${API_URL}|g" src/environments/environment.prod.ts
          sed -i "s|\${GOOGLE_CLIENT_ID}|${GOOGLE_CLIENT_ID}|g" src/environments/environment.prod.ts
        env:
          API_URL: ${{ secrets.API_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Build Angular
        working-directory: geo-game-ui
        run: npm run build -- --configuration production --base-href /${{ github.event.repository.name }}/

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: geo-game-ui/dist/geo-game-ui/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4