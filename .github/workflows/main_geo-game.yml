# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - geo-game

on:
  push:
    branches: [ main ]
    paths: 
      - 'geo-game/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore geo-game/geo-game.csproj

      - name: Publish
        run: dotnet publish geo-game/geo-game.csproj -c Release -o publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0BEDB81816F64C80AE2FB2BC6A6D3734 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D00C1BC141774C7C825AEC0621C0C5E3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E109DD6480C04136A39F5D73DCA4213A }}


      - name: Set Azure App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: geo-game
          app-settings-json: |
            [
              {
                "name": "ConnectionStrings__DefaultConnection",
                "value": "${{ secrets.DEFAULT_CONNECTION }}",
                "slotSetting": false
              },
              {
                "name": "Authentication__SecretKey",
                "value": "${{ secrets.SECRET_KEY }}",
                "slotSetting": false
              },
              {
                "name": "Authentication__Google__ClientId",
                "value": "${{ secrets.GOOGLE_CLIENT_ID }}",
                "slotSetting": false
              },
              {
                "name": "Authentication__Google__ClientSecret",
                "value": "${{ secrets.GOOGLE_CLIENT_SECRET }}",
                "slotSetting": false
              },
              {
                "name": "Cors__AllowedOrigins",
                "value": "${{ secrets.CORS_ALLOWED_ORIGINS }}",
                "slotSetting": false
              }
            ]

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'geo-game'
          package: .
