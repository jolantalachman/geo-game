name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      env:
        AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        AUTH_ISSUER: ${{ secrets.AUTH_ISSUER }}
        AUTH_AUDIENCE: ${{ secrets.AUTH_AUDIENCE }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
      run: |
        # Export repo secrets as environment variables that the app's configuration can read
        echo "Authentication__SecretKey=$AUTH_SECRET" >> $GITHUB_ENV
        echo "Authentication__Issuer=$AUTH_ISSUER" >> $GITHUB_ENV
        echo "Authentication__Audience=$AUTH_AUDIENCE" >> $GITHUB_ENV
        echo "Authentication__Google__ClientId=$GOOGLE_CLIENT_ID" >> $GITHUB_ENV
        echo "Authentication__Google__ClientSecret=$GOOGLE_CLIENT_SECRET" >> $GITHUB_ENV
        echo "Cors__AllowedOrigins=$CORS_ALLOWED_ORIGINS" >> $GITHUB_ENV
        dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      run: dotnet test --no-build --verbosity normal
